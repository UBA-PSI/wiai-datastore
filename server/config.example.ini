# WIAI Datastore server configuration (python -m wds_server --db <path> --config <this file>).
# Every key is optional except [escrow] and [operator]. Values shown are the defaults. The [sandbox] section is below.

[server]
# public_base = https://wiai.uni-bamberg.de/datastore
# client_dir = /opt/wiai-datastore/client/dist       ; default: <repo>/client/dist
# disk_path = /var/lib/wiai-datastore                ; directory probed for read-only mode; default: directory of --db
# read_only_threshold = 0.85                         ; fraction of the disk in use ("df" Use%) from which writes stop
# sweep_interval = 3600                              ; seconds between maintenance sweeps inside the server; 0 = off
# privacy_url = https://wiai.uni-bamberg.de/datastore/privacy
# docs_dir = /opt/wiai-datastore/app/docs/site       ; llms.txt, *.md and export.html; default: <app>/docs/site
# library_latest = 1.0.0                             ; default: highest wds-<version>.js in client_dir
# library_deprecated =                               ; space or comma separated library versions that show the banner

[limits.defaults]
# max_value_bytes = 10485760
# vault_bytes = 209715200
# scope_bytes = 2147483648
# max_vaults = 50
# history_versions = 10

[limits.ceilings]
# max_value_bytes = 26214400
# vault_bytes = 1073741824
# scope_bytes = 10737418240
# max_vaults = 500
# history_versions = 50

[ratelimit]
# ip_failures = 60
# ip_window = 60
# id_failures = 10
# id_window = 60
# create = 30
# create_window = 3600

[loginpsi]
# Dashboard login through login.psi (PLAN 6). Without a key file the dashboard says "login not configured".
# key_file = /etc/wiai-datastore/loginpsi.key        ; 32 bytes, base64, readable only by the service
# app = wiai-datastore                               ; name of the application registered on login.psi
# url = https://login.psi.uni-bamberg.de

[dashboard]
# operators = alice some-user@uni-bamberg.de        ; space separated login.psi user IDs or e-mail addresses
# session_idle = 7200                                ; seconds without a request before a dashboard session ends
# session_absolute = 43200                           ; seconds after login at which every session ends
# dev_login = false                                  ; tests and local development ONLY: anybody can log in as anybody

[privacy]
# Texts of the Art. 13 page /datastore/privacy that the operator decides (PLAN 13).
# updated = <date or version of the last review>      ; shown as "Stand" / "Last updated"; no date is built in. "German text / English text" is split by page language
# updated_de = Entwurf, Prüfung steht aus            ; optional: the text per language (wins over "updated")
# updated_en = Draft, review pending
# backup_retention_de = Sicherungen der virtuellen Maschine: Aufbewahrungsfrist wird festgelegt.
# backup_retention_en = Backups of the virtual machine: the retention period is being determined.

# The public sandbox (PLAN 17): a scope with open enrollment, small quotas and a nightly wipe, for testing apps. The presence of
# this section turns it on; without it there is no sandbox. The server creates and updates the scope from these values at start
# (a scope with this ID that this section did not create stops the start), and deletes it when the section is removed.
# To switch it on, remove the "# " in front of [sandbox] and scope_id. The other values are the defaults.
# Comments go on their own lines or after " ;".
# [sandbox]
# scope_id = sandbox-000000
# enabled = true                     ; false: the scope stays, vault creation and invite redeeming answer 503 sandbox_disabled
# name = WIAI Datastore sandbox
# wipe_time = 03:30                  ; local time (timezone below) of the nightly wipe; it runs in the next sweep, up to an hour later
# timezone = Europe/Berlin
# hibp = false                       ; breach check of passphrases
# max_value_bytes = 524288           ; limits as in [limits.defaults]; each at most its ceiling
# vault_bytes = 2097152
# scope_bytes = 1073741824
# max_vaults = 500
# history_versions = 2
# evict_min_age = 1800               ; seconds; vaults younger than this are never evicted when the sandbox is full
# create_per_ip = 20                 ; vault creations per IP bucket (IPv6 /56, see create_ipv6_prefix) in create_window, on top of
#                                    ; [ratelimit] create. A teaching room behind one NAT address shares one bucket: raise it there.
# create_window = 3600
# create_ipv6_prefix = 56            ; IPv6 clients count per prefix of this length (a home connection owns a /56)
# create_global = 60                 ; vault creations of the whole sandbox per create_global_window; beyond it 503 sandbox_busy
# create_global_window = 600         ; (a vault its owner deletes again gives its creation back)
# invite_slots = 3                   ; invites per sandbox vault (open plus redeemed)

[escrow]
# Public keys (base64url, 65-byte uncompressed P-256 points) of the current and the spare escrow key set.
current_e_pub = CHANGE-ME
current_s_pub = CHANGE-ME
spare_e_pub = CHANGE-ME
spare_s_pub = CHANGE-ME

[operator]
# SHA-256 of each operator token ("wdsop.…"), base64url or hex, space or comma separated.
# Generate a pair with: python -m wds_server.cli operator-token
token_hashes = CHANGE-ME
